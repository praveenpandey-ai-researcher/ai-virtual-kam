<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual KAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Reusable icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Snapdeal mark, redrawn as a vector from the brand image supplied for this assignment -->
      <symbol id="i-box" viewBox="52 48 256 256">
        <g fill="currentColor" stroke="currentColor" stroke-width="7" stroke-linejoin="round">
          <path d="M114 88 173 190H287L221 277H120L72 190Z"/>
          <path d="M136 76H234L288 166H235L208 121H160Z"/>
        </g>
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.57 3.6a1 1 0 0 1-.25 1z"/></symbol>
      <symbol id="i-phone-off" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.2.25-4.6.72v3.1a1 1 0 0 1-.56.9c-.98.5-1.87 1.12-2.66 1.85a1 1 0 0 1-1.4-.02L.3 13.07a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.5 0 8.6 1.76 11.7 4.66a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.4.02 11.6 11.6 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
      <symbol id="i-headset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/><path d="M19.5 19c0 1.5-1.5 2.5-4 2.5H13"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11h4v9zM10 20V7h4v13zM16 20V4h4v16zM3 20h18"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.6V5a1.5 1.5 0 0 1 1.5-1.5h7.6l8 8a1.5 1.5 0 0 1 0 2.1l-6 6a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.4"/></symbol>
      <symbol id="i-parcel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8 12 4l8.5 4v9L12 21l-8.5-4zM3.5 8 12 12l8.5-4M12 12v9M7.7 6 16.3 10"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 10v4M8.5 7v10M12 4.5v15M15.5 8v8M19 10.5v3"/></symbol>
      <!-- Riya, the assistant mascot -->
      <symbol id="i-riya" viewBox="0 0 230 190">
        <path d="M36 108c-22-34-4-80 44-88 40-7 70-22 104 4 30 23 34 70 8 104-22 29-66 40-104 34-24-4-40-34-52-54z" fill="#ffe1e8"/>
        <path d="M176 28l10-16M188 40l18-9M192 54h16" stroke="#e4003f" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M70 150c-4-36 12-58 46-58s50 22 46 58c-1 12-91 12-92 0z" fill="#fff" stroke="#e9edf3" stroke-width="2"/>
        <circle cx="116" cy="128" r="9" fill="#f1f4f8"/>
        <path d="M66 120c-14 6-20 22-16 38" stroke="#fff" stroke-width="15" stroke-linecap="round" fill="none"/>
        <path d="M66 120c-14 6-20 22-16 38" stroke="#e9edf3" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(-8 0)"/>
        <rect x="112" y="38" width="8" height="12" rx="3" fill="#1d2233"/>
        <rect x="62" y="46" width="108" height="76" rx="36" fill="#fff" stroke="#e9edf3" stroke-width="2"/>
        <rect x="78" y="60" width="76" height="46" rx="23" fill="#1d2233"/>
        <path d="M95 82c3-6 11-6 14 0M123 82c3-6 11-6 14 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M108 93c5 5 11 5 16 0" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M146 102c2-13 22-13 24 0" stroke="#b7002f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M134 104l48-6 8 56-50 8z" fill="#e4003f"/>
        <g transform="rotate(-6 160 130) translate(132.5 104) scale(.155)" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"><path d="M114 88 173 190H287L221 277H120L72 190Z"/><path d="M136 76H234L288 166H235L208 121H160Z"/></g>
        <path d="M124 138c8 6 16 6 22 2" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
      </symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="logo">KAM</span>
      <div>
        <div class="brand-title">Virtual Key Account Manager</div>
        <div class="brand-sub">AI voice assistant for sellers · Prototype</div>
      </div>
    </div>
    <div class="seller-chip"><svg class="ico-svg"><use href="#i-headset"/></svg> Seller support line</div>
  </header>

  <main class="layout">
    <!-- Left: the call -->
    <section class="card call">
      <div class="voice">
        <div class="orb" id="orb" data-state="idle">
          <span class="orb-halo"></span>
          <span class="orb-ring"></span>
          <span class="orb-core"><svg><use href="#i-box"/></svg></span>
        </div>
        <div class="wave" id="wave" aria-hidden="true"></div>
        <div class="status" id="status">Ready to call</div>
        <div class="status-sub" id="status-sub">Tap the button to connect with Riya,<br>your Snapdeal Key Account Manager</div>
        <div class="mode hidden" id="mode"></div>
      </div>
      <button id="call-btn" class="btn btn-start"><svg class="ico-svg"><use href="#i-phone"/></svg><span>Call</span></button>
      <p class="hint"><svg class="ico-svg"><use href="#i-mic"/></svg><span id="hint">Speak naturally, in English or Hindi</span></p>

      <h2 class="section-title rule">Live transcript</h2>
      <div class="transcript" id="transcript"></div>
    </section>

    <!-- Right: starts as a welcome panel; data appears as the conversation reaches each topic -->
    <section class="side" id="feed" aria-live="polite"></section>
  </main>

  <div class="tooltip hidden" id="tooltip"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
